name: Repository checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Privacy and repository quality
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Verify Gradle wrapper
        run: ./gradlew --no-daemon --version

      - name: Verify privacy and release boundaries
        shell: bash
        run: |
          set -euo pipefail

          forbidden_files="$(git ls-files | grep -E '(^|/)(keystore\.properties|release\.properties)$|\.(apk|aab|jks|keystore)$' || true)"
          if [[ -n "$forbidden_files" ]]; then
            echo "Forbidden release material is tracked:"
            echo "$forbidden_files"
            exit 1
          fi

          if grep -R --include='AndroidManifest.xml' 'android.permission.INTERNET' app/src; then
            echo "Mealory must remain offline; INTERNET permission detected."
            exit 1
          fi

      - name: Verify GitHub presentation assets
        shell: bash
        run: |
          set -euo pipefail
          required_files=(
            README.md
            LICENSE
            CONTRIBUTING.md
            SECURITY.md
            store/oppo/assets/mealory-oppo-icon-512.png
            store/oppo/screenshots/01-home.jpg
            store/oppo/screenshots/02-record.png
            store/oppo/screenshots/03-calendar.png
            store/oppo/screenshots/04-memories.jpg
            store/oppo/screenshots/05-backup.png
          )

          for file in "${required_files[@]}"; do
            test -s "$file" || { echo "Missing or empty presentation file: $file"; exit 1; }
          done
