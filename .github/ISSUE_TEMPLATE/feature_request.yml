name: 功能建议
description: 提议与 Mealory 产品方向一致的体验改进
title: "[建议] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
      description: 请描述使用场景，而不只是一个解决方案。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
  - type: checkboxes
    id: principles
    attributes:
      label: 产品原则
      options:
        - label: 这个建议尊重离线、私人、无打卡压力的产品方向。
          required: true
